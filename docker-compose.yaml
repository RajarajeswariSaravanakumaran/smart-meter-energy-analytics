version: "3"

services:

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    restart: unless-stopped

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - namenode:/hadoop/dfs/name

    environment:
      CLUSTER_NAME: test
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: "3"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

    networks:
      - hadoop


  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    restart: unless-stopped

    depends_on:
      - namenode

    ports:
      - "9864:9864"

    volumes:
      - datanode:/hadoop/dfs/data

    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: "3"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

    networks:
      - hadoop


  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    hostname: datanode2
    restart: unless-stopped

    depends_on:
      - namenode

    volumes:
      - datanode2:/hadoop/dfs/data

    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: "3"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

    networks:
      - hadoop


  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode3
    hostname: datanode3
    restart: unless-stopped

    depends_on:
      - namenode

    volumes:
      - datanode3:/hadoop/dfs/data

    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: "3"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

    networks:
      - hadoop


  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    hostname: resourcemanager
    restart: unless-stopped

    depends_on:
      - namenode
      - datanode
      - datanode2
      - datanode3

    ports:
      - "8088:8088"

    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 datanode2:9864 datanode3:9864"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      MAPRED_CONF_mapreduce_framework_name: yarn

    networks:
      - hadoop


  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    hostname: nodemanager
    restart: unless-stopped

    depends_on:
      - resourcemanager

    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 datanode2:9864 datanode3:9864 resourcemanager:8088"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      MAPRED_CONF_mapreduce_framework_name: yarn

    networks:
      - hadoop


  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    hostname: historyserver
    restart: unless-stopped

    depends_on:
      - resourcemanager

    ports:
      - "19888:19888"

    volumes:
      - historyserver:/hadoop/yarn/timeline

    environment:
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      CORE_CONF_hadoop_http_staticuser_user: root
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      MAPRED_CONF_mapreduce_framework_name: yarn

    networks:
      - hadoop


  spark-master:
    image: apache/spark:3.5.6-scala2.12-java17-python3-r-ubuntu
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080

    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"

    networks:
      - hadoop


  spark-worker:
    image: apache/spark:3.5.6-scala2.12-java17-python3-r-ubuntu
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped

    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 2
      --memory 2G

    networks:
      - hadoop


volumes:
  namenode:
  datanode:
  datanode2:
  datanode3:
  historyserver:


networks:
  hadoop:
    driver: bridge
